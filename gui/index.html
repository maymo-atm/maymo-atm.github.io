<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maymo-gui — interactive vortex simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <!-- Uncomment when ready: <script src="app.js" defer></script> -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --bg2:       #f6f6f4;
      --text:      #1a1a18;
      --text2:     #5a5a56;
      --text3:     #9a9a94;
      --border:    rgba(0,0,0,0.09);
      --border2:   rgba(0,0,0,0.14);
      --mono:      'DM Mono', monospace;
      --sans:      'DM Sans', sans-serif;
      --radius:    10px;
    }

    body {
      font-family: var(--sans); background: var(--bg); color: var(--text);
      font-size: 15px; -webkit-font-smoothing: antialiased;
      height: 100vh; display: flex; flex-direction: column;
    }

    nav {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 52px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 0.5px solid var(--border);
    }

    .nav-logo {
      font-family: var(--mono); font-size: 15px; font-weight: 500;
      color: var(--text); text-decoration: none; letter-spacing: -0.01em;
    }

    .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }

    .nav-links a {
      font-size: 13px; color: var(--text2); text-decoration: none;
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--text); font-weight: 500; }

    .page-header {
      flex-shrink: 0; padding: 20px 40px 16px;
      border-bottom: 0.5px solid var(--border);
      display: flex; align-items: baseline; gap: 12px;
    }
    .page-header h1 { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
    .page-header p  { font-size: 13px; color: var(--text2); }

    #app-mount {
      flex: 1; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg2);
    }

    .app-placeholder { text-align: center; padding: 48px; }
    .app-placeholder .icon { font-size: 32px; margin-bottom: 16px; display: block; }
    .app-placeholder h2 { font-size: 16px; font-weight: 500; margin-bottom: 8px; }
    .app-placeholder p {
      font-size: 13px; color: var(--text2); max-width: 340px;
      margin: 0 auto 20px; line-height: 1.7;
    }
    .app-placeholder code {
      font-family: var(--mono); font-size: 12px;
      background: var(--bg); border: 0.5px solid var(--border2);
      border-radius: 5px; padding: 2px 7px; color: var(--text2);
    }
    .back-link { font-size: 12px; color: var(--text3); text-decoration: none; }
    .back-link:hover { color: var(--text2); }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="../index.html">maymo</a>
  <ul class="nav-links">
    <li><a href="../docs/index.html">Docs</a></li>
    <li><a href="../docs/notebooks.html">Notebooks</a></li>
    <li><a href="../docs/workflow.html">Workflow</a></li>
    <li><a href="index.html" class="active">maymo-gui</a></li>
    <li><a href="#" id="nav-github">GitHub</a></li>
  </ul>
</nav>

<div class="page-header">
  <h1>maymo-gui</h1>
  <p>Interactive polar vortex simulator — no Python required</p>
</div>

<!-- Your JS app bundle mounts here -->
<div id="app-mount">
  <div class="app-placeholder">
    <span class="icon">🌀</span>
    <h2>App coming soon</h2>
    <p>The maymo-gui prototype will be embedded here. Point your JS bundle at <code>#app-mount</code> to get started.</p>
    <a class="back-link" href="../index.html">← back to main site</a>
  </div>
</div>

</body>
</html>
